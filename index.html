    <!-- Dumbbell mark in the app's accent purple, matching the personal app.
         Inlined as a data URI: no extra request, nothing to cache-bust, and
         SVG stays crisp at 16px in the tab and at any size a browser asks for. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%236a5a8a'%3E%3Crect x='2' y='4' width='7.5' height='24' rx='3'/%3E%3Crect x='22.5' y='4' width='7.5' height='24' rx='3'/%3E%3Crect x='9.5' y='12.5' width='13' height='7' rx='2.5'/%3E%3C/g%3E%3C/svg%3E">
    <!-- Daily accent rotation. Kept byte-identical to the personal app's
         js/accentColor.js so the two banks cannot drift; inlined here only
         because this app ships as a single file. Must stay above the <style>
         block and outside text/babel: Babel transforms asynchronously, so a
         palette applied from the app script would land after first paint and
         flash the default purple on every load. -->
    <script>
        (function () {
            'use strict';

            // Six shades on one lightness ramp — deep 25.5%, accent 32.9%, hi 38.8%,
            // soft 44.6%, muted 50.3%, pale 61.2% — each holding the original purple's
            // exact OKLCH lightness and chroma (C 0.061-0.083) and rotating hue only.
            // That is what makes every entry read as equally dark and equally
            // desaturated: hues picked by eye at these lightnesses drift brighter and
            // muddier apart from each other. It also means no palette is ever harder to
            // read than the purple was. Violet (hue 300) is the original #3a2a5a to
            // within a hair.
            //
            // The personal app references four of the six; the public app also uses
            // `soft` (a gradient hover) and `pale` (italic hint text). Both ship all six
            // so this module stays identical across the two repos and the banks cannot
            // drift apart.
            //
            // `rgb` is the accent as a bare triple, for the one place that needs it
            // inside an rgba() — the header's shadow.
            var BANK = [
                { name: 'Green',   deep: '#002b18', accent: '#09411c', hi: '#1d502d', soft: '#2f613d', muted: '#40714e', pale: '#61916e', rgb: '9, 65, 28' },
                { name: 'Sea',     deep: '#00292a', accent: '#013e3c', hi: '#02504d', soft: '#02615f', muted: '#1e726f', pale: '#489290', rgb: '1, 62, 60' },
                { name: 'Teal',    deep: '#002832', accent: '#003d46', hi: '#004e5a', soft: '#015f6e', muted: '#216f7f', pale: '#4a8f9f', rgb: '0, 61, 70' },
                { name: 'Steel',   deep: '#00253e', accent: '#013a53', hi: '#034b69', soft: '#1f5b7a', muted: '#336b8a', pale: '#568bab', rgb: '1, 58, 83' },
                { name: 'Blue',    deep: '#142140', accent: '#15355f', hi: '#26456f', soft: '#375580', muted: '#486590', pale: '#6885b0', rgb: '21, 53, 95' },
                { name: 'Indigo',  deep: '#211d3e', accent: '#2c2f5f', hi: '#3c3f6f', soft: '#4b4f7f', muted: '#5b5f8f', pale: '#7b7fb0', rgb: '44, 47, 95' },
                { name: 'Violet',  deep: '#2b1939', accent: '#3c2959', hi: '#4c3969', soft: '#5c4979', muted: '#6c5989', pale: '#8c79a9', rgb: '60, 41, 89' },
                { name: 'Plum',    deep: '#331630', accent: '#49254e', hi: '#59355e', soft: '#69446d', muted: '#7a557d', pale: '#9a759d', rgb: '73, 37, 78' },
                { name: 'Orchid',  deep: '#381526', accent: '#522140', hi: '#62314e', soft: '#73415e', muted: '#84526d', pale: '#a5728d', rgb: '82, 33, 64' }
            ];

            // Days are numbered off the *local* calendar date, not Date.now()/86400000.
            // The latter counts UTC days, which would flip the color mid-evening rather
            // than at midnight.
            function dayIndex(date) {
                return Math.floor(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / 86400000);
            }

            function mulberry32(a) {
                return function () {
                    a |= 0; a = a + 0x6D2B79F5 | 0;
                    var t = Math.imul(a ^ a >>> 15, 1 | a);
                    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                    return ((t ^ t >>> 14) >>> 0) / 4294967296;
                };
            }

            // Deterministic shuffle of the whole bank, one per cycle of BANK.length days.
            // Shuffling a full permutation rather than picking at random is what
            // guarantees you see all nine before any repeat.
            function shuffle(cycle, n) {
                var idx = [], rnd = mulberry32(Math.imul(cycle, 2654435761) >>> 0), i, j, t;
                for (i = 0; i < n; i++) idx.push(i);
                for (i = n - 1; i > 0; i--) {
                    j = Math.floor(rnd() * (i + 1));
                    t = idx[i]; idx[i] = idx[j]; idx[j] = t;
                }
                return idx;
            }

            // A plain per-cycle shuffle still lets the last color of one cycle repeat as
            // the first of the next (~1 boundary in n). Swapping the first two entries
            // breaks that run. Only one level of lookback is needed to be exact: for
            // n > 2, swapping positions 0 and 1 can never change position n-1, so the
            // previous cycle's last entry is the same whether or not it was corrected.
            function orderForCycle(cycle, n) {
                var idx = shuffle(cycle, n), t;
                if (cycle > 0 && n > 2 && idx[0] === shuffle(cycle - 1, n)[n - 1]) {
                    t = idx[0]; idx[0] = idx[1]; idx[1] = t;
                }
                return idx;
            }

            function paletteFor(date) {
                var n = BANK.length, day = dayIndex(date), cycle = Math.floor(day / n);
                return BANK[orderForCycle(cycle, n)[((day % n) + n) % n]];
            }

            function apply(palette) {
                var s = document.documentElement.style;
                s.setProperty('--accent', palette.accent);
                s.setProperty('--accent-hi', palette.hi);
                s.setProperty('--accent-soft', palette.soft);
                s.setProperty('--accent-muted', palette.muted);
                s.setProperty('--accent-pale', palette.pale);
                s.setProperty('--accent-deep', palette.deep);
                s.setProperty('--accent-rgb', palette.rgb);
            }

            apply(paletteFor(new Date()));

            // Exposed for the favicon tint in index.html, and so a console poke can
            // preview any day: window.accentColor.apply(window.accentColor.bank[3]).
            window.accentColor = { bank: BANK, paletteFor: paletteFor, apply: apply };
        }());
    </script>
    <!-- Retint the mark to match the day. Local dev (python3 -m http.server)
         holds the favicon at white so a localhost tab is never confused with the
         live GitHub Pages tab beside it. White is the one tint that stays
         unambiguous now that the live favicon changes daily: it is not a hue at
         all, so no palette can drift into looking like it. With both apps served
         locally the two white tabs are distinguishable by title, not by icon --
         same caveat as before. -->
    <script>
        (function () {
            var icon = document.querySelector("link[rel='icon']");
            if (!icon) return;
            var dev = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
            var tint = dev ? '#ffffff' : (window.accentColor && window.accentColor.paletteFor(new Date()).muted);
            if (tint) icon.setAttribute('href', icon.getAttribute('href').replace('%236a5a8a', '%23' + tint.slice(1)));
        }());
    </script>

    <style>
        /* The accent family. The script in <head> overwrites these on <html>
           during head parsing, one palette per calendar day. The values here are
           the original purple, kept as the fallback for the moment before that
           runs. Only hue rotates between palettes -- lightness and chroma are
           fixed, so these six shades always relate to each other exactly as they
           do here, and no palette is ever harder to read than the purple was. */
        :root {
            --accent: #3a2a5a;       /* LOG, active pills, gradients, toast */
            --accent-hi: #4a3a6a;    /* active-pill border, gradient end */
            --accent-soft: #5a4a7a;  /* gradient hover end */
            --accent-muted: #6a5a8a; /* section titles, field labels, gear */
            --accent-pale: #8a7aaa;  /* italic hint text */
            --accent-deep: #2a1a3a;  /* Submit Day */
            --accent-rgb: 58, 42, 90;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #050510;
            color: #b8b8d0;
            padding-bottom: 80px;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            max-width: 100%;
            min-height: 100vh;
        }

        .header {
            background: #0d0d1a;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--accent);
            box-shadow: 0 4px 20px rgba(var(--accent-rgb), 0.2);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 24px;
        }

        .week-indicator {
            font-size: 14px;
            color: var(--accent-muted);
            margin-bottom: 15px;
        }

        .settings-btn {
            background: none;
            border: none;
            color: var(--accent-muted);
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
        }

        .nav {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            flex: 1;
            padding: 12px;
            background: #1a1a2a;
            border: 1px solid #2a2a3a;
            color: #8a8aa0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn.active {
            background: var(--accent);
            border-color: var(--accent-hi);
            color: #b8b8d0;
        }

        .nav-btn:active {
            transform: scale(0.98);
        }

        .content {
            padding: 20px;
        }

        .day-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .day-btn {
            flex: 1;
            padding: 12px;
            background: #1a1a2a;
            border: 1px solid #2a2a3a;
            color: #8a8aa0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .day-btn.active {
            background: var(--accent);
            border-color: var(--accent-hi);
            color: #b8b8d0;
        }

        .day-btn:only-child {
            flex: 1 1 100%;
            min-width: 100%;
        }

        .section-title {
            font-size: 14px;
            color: var(--accent-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 0 10px 0;
            font-weight: 600;
        }

        .exercise-card {
            background: #0d0d1a;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #1a1a2a;
        }

        .exercise-card.logged {
            border-color: var(--accent);
            background: #12121f;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .exercise-name {
            font-size: 16px;
            font-weight: 600;
        }

        .previous-data {
            font-size: 12px;
            color: #888;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-group {
            flex: 1;
        }

        .input-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
            display: block;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            background: #1a1a2a;
            border: 2px solid #2a2a3a;
            border-radius: 8px;
            color: #b8b8d0;
            font-size: 16px;
            -webkit-appearance: none;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        .input-field.error {
            border-color: #ff5555;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent);
        }

        .input-field:disabled {
            opacity: 0.5;
        }

        .log-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: #b8b8d0;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .log-btn:active {
            transform: scale(0.98);
        }

        .log-btn.logged {
            background: #1a1a2a;
            color: var(--accent-muted);
        }

        .save-btn {
            width: 100%;
            padding: 16px;
            background: var(--accent-deep);
            border: none;
            border-radius: 12px;
            color: #b8b8d0;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .save-btn:active {
            transform: scale(0.98);
        }

        .save-btn:disabled {
            background: #1a1a2a;
            color: #666;
        }

        .week-nav {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }

        .week-nav-btn {
            padding: 8px 16px;
            background: #1a1a2a;
            border: 1px solid #2a2a3a;
            color: #8a8aa0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .week-nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .week-title {
            flex: 1;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
        }

        .history-item {
            background: #0d0d1a;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #1a1a2a;
        }

        .history-date {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .history-exercise {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #1a1a2a;
            font-size: 14px;
        }

        .history-exercise:last-child {
            border-bottom: none;
        }

        .history-exercise-name {
            color: var(--accent-muted);
        }

        .history-exercise-data {
            font-weight: 600;
        }

        .chart-container {
            background: #0d0d1a;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid #1a1a2a;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .success-message {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: #b8b8d0;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            z-index: 1000;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        .exercise-select {
            width: 100%;
            padding: 12px;
            background: #1a1a2a;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            color: #b8b8d0;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .exercise-select option {
            background: #0d0d1a;
            color: #b8b8d0;
        }

        canvas {
            max-height: 250px;
        }


        @keyframes pr-pulse {
            0% {
                box-shadow: inset 0 0 0px 0px rgba(255, 215, 0, 0);
            }
            50% {
                box-shadow: inset 0 0 80px 20px rgba(255, 215, 0, 0.8);
            }
            100% {
                box-shadow: inset 0 0 0px 0px rgba(255, 215, 0, 0);
            }
        }

        .pr-badge {
            display: inline-block;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-left: 8px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .pr-suggestion {
            font-size: 11px;
            color: var(--accent-muted);
            margin-bottom: 4px;
            font-weight: 600;
            height: 16px;
            visibility: visible;
        }

        .pr-suggestion.hidden {
            visibility: hidden;
        }

        .input-field.pr-attempt {
            border: 2px solid #FFD700;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 165, 0, 0.1));
        }


        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 5, 16, 0.95);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal {
            background: #0d0d1a;
            border-radius: 12px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            border: 1px solid #2a2a3a;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .modal-btn {
            width: 100%;
            padding: 12px;
            background: #1a1a2a;
            border: 1px solid #2a2a3a;
            color: #8a8aa0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .modal-btn:active {
            transform: scale(0.98);
        }

        .modal-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #b8b8d0;
        }

        .modal-btn.danger {
            background: #3a1a2a;
            border-color: #3a1a2a;
            color: #b8b8d0;
        }

        .file-input {
            display: none;
        }

        .backup-reminder {
            background: #ff9500;
        }

        /* Setup Wizard Styles */
        .wizard-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #050510;
            z-index: 10000;
            overflow-y: auto;
            padding: 20px;
        }

        .wizard-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .wizard-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .wizard-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #b8b8d0;
        }

        .wizard-subtitle {

            color: var(--accent-muted);

            border-radius: 12px;

        }

            display: grid;
            gap: 12px;

        }

            background: #1a1a2a;

            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .template-card:hover {
            border-color: var(--accent);

        }

            border-color: var(--accent);
            background: var(--accent-deep);
        }

        .template-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

        .template-name {

        }

        .calendar-grid {

            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 20px;
        }

        .calendar-day {
            aspect-ratio: 1;
            background: #1a1a2a;
            border: 2px solid #2a2a3a;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .calendar-day:hover {
            border-color: var(--accent);
        }

        // Calculate which day it should be based on the date
        function getTodayDay() {
            // Load schedule from localStorage
            const savedSchedule = storage.getItem('gymScheduleConfig');
            if (!savedSchedule) {
                // Fallback to alternating days if no schedule
                const today = new Date();
                const referenceDate = new Date(2025, 11, 14);
                today.setHours(0, 0, 0, 0);
                referenceDate.setHours(0, 0, 0, 0);
                const diffTime = today - referenceDate;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                return (diffDays % 2 === 0) ? 1 : 2;
            }

            const schedule = JSON.parse(savedSchedule);

            // If the schedule wasn't explicitly set on the preset, don't highlight any day as today
            if (!schedule.scheduleIsExplicit) return null;

            const today = new Date();
            const dayOfWeek = today.getDay(); // 0 = Sunday, 1 = Monday, ..., 6 = Saturday

            // Map day numbers to day names
            const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const todayName = dayNames[dayOfWeek];

            // Find today's workout day from schedule
            const todayWorkout = schedule.workoutDays.find(wd => wd.dayOfWeek === todayName);

            if (todayWorkout) {
                return todayWorkout.workoutDayNumber;
            }

            // If today is not a workout day, return null (no day to highlight)
            return null;
        }

        // Get the Monday of the week containing a given date
        function getMondayOfWeek(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            const day = d.getDay();
            const diff = day === 0 ? -6 : 1 - day; // If Sunday (0), go back 6 days; otherwise go to Monday
            d.setDate(d.getDate() + diff);
            return d;
        }

        // Get the Monday of the first workout (Week 1 start date)
        // This is cached in localStorage to avoid recalculating
        function getFirstWorkoutMonday(workoutHistory) {
            // Try to get cached value first
            const cached = storage.getItem('firstWorkoutMonday');
            if (cached) {
                return new Date(cached);
            }

            // If no cache and no workout history, use today as default
            if (!workoutHistory || workoutHistory.length === 0) {
                const today = getMondayOfWeek(new Date());
                storage.setItem('firstWorkoutMonday', today.toISOString());
                return today;
            }

            // Find the earliest workout date
            const earliestWorkout = workoutHistory.reduce((earliest, workout) => {
                const workoutDate = new Date(workout.date);
                return !earliest || workoutDate < earliest ? workoutDate : earliest;
            }, null);

            // Get the Monday of that week
            const firstMonday = getMondayOfWeek(earliestWorkout);

            // Cache it for future use
            storage.setItem('firstWorkoutMonday', firstMonday.toISOString());

            return firstMonday;
        }

        // Calculate consecutive week number starting from first workout
        // Week 1 = the week of the first workout, incrementing indefinitely
        function getConsecutiveWeek(date, workoutHistory) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);

            const firstMonday = getFirstWorkoutMonday(workoutHistory);
            const currentMonday = getMondayOfWeek(d);

            // Calculate weeks difference
            const diffTime = currentMonday - firstMonday;
            const diffWeeks = Math.floor(diffTime / (7 * 24 * 60 * 60 * 1000));

            return diffWeeks + 1; // Week 1 is the first week
        }

        // Calculate current week number (consecutive weeks starting from first workout)
        function getCurrentWeek(workoutHistory) {
            return getConsecutiveWeek(new Date(), workoutHistory);

            if (!timeStr) return 0;
            const parts = timeStr.split(':');
            if (parts.length !== 2) return 0;
            const minutes = parseInt(parts[0]) || 0;
            const seconds = parseInt(parts[1]) || 0;
            return minutes * 60 + seconds;

            removeItem: (key) => localStorage.removeItem(APP_NAMESPACE + key),

        // Firebase web-app config (project shared with the coach's personal
        // gym-tracker). Safe to commit: the apiKey is a public identifier —
        // access control lives in the Firestore security rules, which
        // allowlist each coached client's Google email.
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyB7KLRyT7ReQVko80nx6Dddt0C4EVVTHbg",
            authDomain: "gym-tracker-822cd.firebaseapp.com",
            projectId: "gym-tracker-822cd",
            storageBucket: "gym-tracker-822cd.firebasestorage.app",
            messagingSenderId: "560629607472",
            appId: "1:560629607472:web:401785bdd829f2f86f91f5"
        };

        // Firebase bootstrap. Loads the compat SDK dynamically and initializes
        // it — only outside the local/test namespace (or with the dev opt-in),
        // so the test suite and plain localhost make zero gstatic requests.
        // window.FIREBASE_INIT resolves true when ready, false when local-only.
        // Manual localhost testing: localStorage.setItem('gym-local:enableFirebaseDev', 'true')
        window.FIREBASE_INIT = (function () {
            const SDK_BASE = 'https://www.gstatic.com/firebasejs/10.14.1/';

            const devOptIn = localStorage.getItem('gym-local:enableFirebaseDev') === 'true';
            if ((APP_NAMESPACE === 'gym-local:' && !devOptIn) || !FIREBASE_CONFIG) {
                return Promise.resolve(false);
            }

            const load = (name) => new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = SDK_BASE + name;
                s.onload = resolve;
                s.onerror = () => reject(new Error('SDK script failed to load: ' + name));
                document.head.appendChild(s);
            });

            // app-compat must execute before the feature SDKs.
            return load('firebase-app-compat.js')
                .then(() => Promise.all([
                    load('firebase-auth-compat.js'),
                    load('firebase-firestore-compat.js'),
                ]))
                .then(() => {
                    firebase.initializeApp(FIREBASE_CONFIG);
                    firebase.firestore().enablePersistence({ synchronizeTabs: true })
                        .catch((err) => {
                            console.warn('[firebase] offline persistence unavailable:', err && err.code);
                        });
                    return true;
                })
                .catch((e) => {
                    console.warn('[firebase] unavailable, staying local-only:', e && e.message);
                    return false;
                });
        })();
        window.FIREBASE_READY = false;
        window.FIREBASE_INIT.then((ready) => { window.FIREBASE_READY = ready; });

        // Storage repository seam. The four synced keys (workout history,
        // exercise config, schedule, setup-completed) are written through
        // `repo`; device-local keys (tutorial/backup-reminder flags, week
        // cache, one-shot migration sentinels) bypass it on purpose.
        // Promise/.then style only — @babel/standalone lowers async/await to
        // regenerator form, which crashes without a polyfill.
        function createLocalStorageRepo() {
            const parse = (raw) => {
                if (!raw) return null;
                try {
                    return JSON.parse(raw);
                } catch (e) {
                    console.warn('[repo] Ignoring unparseable stored value:', e);
                    return null;
                }
            };

            return {
                mode: 'local',

                loadAll: () => Promise.resolve({
                    workoutHistory: parse(storage.getItem('gymWorkoutHistory')),
                    exerciseConfig: parse(storage.getItem('gymExerciseConfig')),
                    scheduleConfig: parse(storage.getItem('gymScheduleConfig')),
                    setupCompleted: parse(storage.getItem('gymSetupCompleted')),
                }),

                // Fire-and-forget saves: callers never await these.
                saveHistory: (history) => {
                    storage.setItem('gymWorkoutHistory', JSON.stringify(history));
                },
                saveExerciseConfig: (config) => {
                    storage.setItem('gymExerciseConfig', JSON.stringify(config));
                },
                saveScheduleConfig: (schedule) => {
                    storage.setItem('gymScheduleConfig', JSON.stringify(schedule));
                },
                saveSetupCompleted: (setup) => {
                    storage.setItem('gymSetupCompleted', JSON.stringify(setup));
                },

                clearAll: () => {
                    storage.removeItem('gymWorkoutHistory');
                    storage.removeItem('gymExerciseConfig');
                    storage.removeItem('gymScheduleConfig');
                    storage.removeItem('gymSetupCompleted');
                    return Promise.resolve();
                },

                status: () => ({ mode: 'local', signedIn: false, pendingWrites: 0 }),
            };
        }

        // Firestore-backed repo. One document per workout entry at
        // users/{uid}/workouts/{entryId}; the three config docs live under
        // users/{uid}/settings/. Writes are fire-and-forget (Firestore's
        // offline queue owns durability) and mirror to localStorage so a
        // signed-out or offline-cold-cache session still has the data.
        function createFirestoreRepo(user) {
            const db = firebase.firestore();
            const userDoc = db.collection('publicUsers').doc(user.uid);
            const workoutsCol = userDoc.collection('workouts');
            const settingsCol = userDoc.collection('settings');

            const lastSaved = new Map(); // entryId -> serialized entry
            let pendingWrites = 0;

            const sanitize = (obj) => JSON.parse(JSON.stringify(obj));

            const track = (promise, what) => {
                pendingWrites++;
                promise
                    .then(() => { pendingWrites--; })
                    .catch((e) => {
                        pendingWrites--;
                        console.warn('[repo] ' + what + ' write failed:', e);
                    });
            };

            // Entries need an identity that survives `date` rewrites; assigned
            // in place so React's objects keep their ids across saves.
            const ensureEntryIds = (history) => {
                history.forEach((w) => {
                    if (!w.entryId) {
                        const day = String(w.date || new Date().toISOString()).slice(0, 10);
                        w.entryId = 'w-' + day + '-' + Math.random().toString(36).slice(2, 7);
                    }
                });
            };

            const mirror = createLocalStorageRepo();

            const saveSettingsDoc = (docId, value) => {
                track(settingsCol.doc(docId).set(sanitize(value)), docId);
            };

            return {
                mode: 'firestore',

                loadAll: () => Promise.all([
                    workoutsCol.orderBy('date', 'desc').get(),
                    settingsCol.get(),
                ]).then(([workoutsSnap, settingsSnap]) => {
                    const history = workoutsSnap.docs.map((d) => d.data());
                    history.forEach((w) => lastSaved.set(w.entryId, JSON.stringify(w)));
                    const settings = {};
                    settingsSnap.docs.forEach((d) => { settings[d.id] = d.data(); });

                    if (history.length > 0) mirror.saveHistory(history);
                    if (settings.exerciseConfig) mirror.saveExerciseConfig(settings.exerciseConfig);
                    if (settings.scheduleConfig) mirror.saveScheduleConfig(settings.scheduleConfig);
                    if (settings.setupCompleted) mirror.saveSetupCompleted(settings.setupCompleted);

                    // Empty cloud data (e.g. offline cold cache before first
                    // sync): fall back to whatever this device has.
                    return mirror.loadAll().then((local) => ({
                        workoutHistory: history.length > 0 ? history : local.workoutHistory,
                        exerciseConfig: settings.exerciseConfig || local.exerciseConfig,
                        scheduleConfig: settings.scheduleConfig || local.scheduleConfig,
                        setupCompleted: settings.setupCompleted || local.setupCompleted,
                    }));
                }).catch((e) => {
                    console.warn('[repo] Firestore load failed, using local mirror:', e);
                    return mirror.loadAll();
                }),

                saveHistory: (history) => {
                    ensureEntryIds(history);
                    const seen = new Set();
                    history.forEach((w) => {
                        seen.add(w.entryId);
                        const serialized = JSON.stringify(w);
                        if (lastSaved.get(w.entryId) !== serialized) {
                            lastSaved.set(w.entryId, serialized);
                            track(workoutsCol.doc(w.entryId).set(sanitize(w)), 'workout');
                        }
                    });
                    Array.from(lastSaved.keys()).forEach((entryId) => {
                        if (!seen.has(entryId)) {
                            lastSaved.delete(entryId);
                            track(workoutsCol.doc(entryId).delete(), 'workout delete');
                        }
                    });
                    mirror.saveHistory(history);
                },

                saveExerciseConfig: (config) => {
                    saveSettingsDoc('exerciseConfig', config);
                    mirror.saveExerciseConfig(config);
                },
                saveScheduleConfig: (schedule) => {
                    saveSettingsDoc('scheduleConfig', schedule);
                    mirror.saveScheduleConfig(schedule);
                },
                saveSetupCompleted: (setup) => {
                    saveSettingsDoc('setupCompleted', setup);
                    mirror.saveSetupCompleted(setup);
                },

                clearAll: () => {
                    const batch = db.batch();
                    lastSaved.forEach((_, entryId) => batch.delete(workoutsCol.doc(entryId)));
                    ['exerciseConfig', 'scheduleConfig', 'setupCompleted', 'meta']
                        .forEach((docId) => batch.delete(settingsCol.doc(docId)));
                    lastSaved.clear();
                    return batch.commit()
                        .catch((e) => console.warn('[repo] cloud clear failed:', e))
                        .then(() => mirror.clearAll());
                },

                status: () => ({
                    mode: 'firestore',
                    signedIn: true,
                    email: user.email,
                    pendingWrites,
                }),
            };
        }

        // One-time import of this device's local data into Firestore, run
        // during repo selection on the FIRST sign-in for this account
        // (settings/meta is the "already done" marker). Cloud entries win for
        // any calendar day they cover; local entries fill the gaps. A JSON
        // backup auto-downloads before anything is uploaded. Failures are
        // non-fatal and retry next load (meta is only written on success).
        function migrateLocalToFirestore(user) {
            const db = firebase.firestore();
            const userDoc = db.collection('publicUsers').doc(user.uid);
            const workoutsCol = userDoc.collection('workouts');
            const settingsCol = userDoc.collection('settings');
            const local = createLocalStorageRepo();
            const sanitize = (obj) => JSON.parse(JSON.stringify(obj));

            const downloadPreSyncBackup = (localData) => {
                try {
                    const dataStr = JSON.stringify({
                        workoutHistory: localData.workoutHistory || [],
                        schedule: localData.scheduleConfig,
                        exerciseConfig: localData.exerciseConfig,
                        exportDate: new Date().toISOString(),
                    }, null, 2);
                    const url = URL.createObjectURL(new Blob([dataStr], { type: 'application/json' }));
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'gym-tracker-PRE-SYNC-BACKUP-' +
                        new Date().toISOString().replace(/[:.]/g, '-') + '.json';
                    link.click();
                    URL.revokeObjectURL(url);
                } catch (e) {
                    console.warn('[repo] pre-sync backup download failed:', e);
                }
            };

            return settingsCol.doc('meta').get().then((meta) => {
                if (meta.exists && meta.data().importedFromLocalAt) {
                    return; // import already happened (this or another device)
                }
                return Promise.all([local.loadAll(), workoutsCol.get(), settingsCol.get()])
                    .then(([localData, cloudSnap, settingsSnap]) => {
                        const cloudSettings = {};
                        settingsSnap.docs.forEach((d) => { cloudSettings[d.id] = d.data(); });

                        const localHistory = localData.workoutHistory || [];
                        const dayOf = (w) => String(w.date || '').slice(0, 10);
                        const cloudDays = new Set(cloudSnap.docs.map((d) => dayOf(d.data())));

                        const toUpload = [];
                        const pickedByDay = new Map();
                        localHistory.forEach((w) => {
                            if (cloudDays.has(dayOf(w))) return;
                            const existing = pickedByDay.get(dayOf(w));
                            if (!existing || (w.submitted && !existing.submitted)) {
                                pickedByDay.set(dayOf(w), w);
                            }
                        });
                        pickedByDay.forEach((w) => {
                            if (!w.entryId) {
                                w.entryId = 'w-' + dayOf(w) + '-' + Math.random().toString(36).slice(2, 7);
                            }
                            toUpload.push(w);
                        });

                        if (toUpload.length > 0) {
                            downloadPreSyncBackup(localData);
                        }

                        let chain = Promise.resolve();
                        for (let i = 0; i < toUpload.length; i += 400) {
                            const chunk = toUpload.slice(i, i + 400);
                            chain = chain.then(() => {
                                const batch = db.batch();
                                chunk.forEach((w) => batch.set(workoutsCol.doc(w.entryId), sanitize(w)));
                                return batch.commit();
                            });
                        }

                        return chain.then(() => {
                            const writes = [];
                            if (!cloudSettings.exerciseConfig && localData.exerciseConfig) {
                                writes.push(settingsCol.doc('exerciseConfig').set(sanitize(localData.exerciseConfig)));
                            }
                            if (!cloudSettings.scheduleConfig && localData.scheduleConfig) {
                                writes.push(settingsCol.doc('scheduleConfig').set(sanitize(localData.scheduleConfig)));
                            }
                            if (!cloudSettings.setupCompleted && localData.setupCompleted) {
                                writes.push(settingsCol.doc('setupCompleted').set(sanitize(localData.setupCompleted)));
                            }
                            writes.push(settingsCol.doc('meta').set({
                                importedFromLocalAt: new Date().toISOString(),
                                importedCount: toUpload.length,
                                schemaVersion: 1,
                            }));
                            return Promise.all(writes);
                        }).then(() => {
                            console.log('[repo] imported ' + toUpload.length + ' local workouts to Firestore');
                        });
                    });
            });
        }

        // Sign-in/out for the Settings UI and sync banner. Popup, not
        // redirect (signInWithRedirect breaks on browsers that partition
        // third-party storage when authDomain differs from github.io).
        function repoSignIn() {
            return firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())
                .then(() => window.location.reload())
                .catch((e) => {
                    if (e && e.code === 'auth/popup-closed-by-user') return;
                    console.warn('[repo] sign-in failed:', e && e.code);
                    alert('Sign-in failed: ' + ((e && e.message) || 'unknown error'));
                });
        }
        function repoSignOut() {
            return firebase.auth().signOut().then(() => window.location.reload());
        }
        window.repoSignIn = repoSignIn;
        window.repoSignOut = repoSignOut;

        // Repo selection, decided once per page load:
        // - gym-local namespace / SDK load failure -> localStorage.
        // - otherwise the first auth-state callback decides: signed in ->
        //   import-if-needed then Firestore, signed out -> localStorage.
        const repoReady = window.FIREBASE_INIT.then((firebaseReady) => {
            if (!firebaseReady) {
                return createLocalStorageRepo();
            }
            return new Promise((resolve) => {
                const unsubscribe = firebase.auth().onAuthStateChanged((user) => {
                    unsubscribe();
                    if (!user) {
                        resolve(createLocalStorageRepo());
                        return;
                    }
                    resolve(
                        migrateLocalToFirestore(user)
                            .catch((e) => console.warn('[repo] local import failed (will retry next load):', e))
                            .then(() => createFirestoreRepo(user))
                    );
                });
            });
        }).then((repo) => {
            window.repo = repo;
            return repo;
        });
        window.repoReady = repoReady;

        // Migrate existing data to namespaced keys (one-time migration for existing users)
        function migrateToNamespacedStorage() {
            const keysToMigrate = ['gymWorkoutHistory', 'gymExerciseConfig', 'lastBackupReminder'];

            keysToMigrate.forEach(key => {
                // Check if data exists in the old location (without namespace)
                const oldData = localStorage.getItem(key);
                // Check if data already exists in the new location (with namespace)
                const newData = storage.getItem(key);

                // Only migrate if old data exists and new location is empty
                if (oldData && !newData) {
                    storage.setItem(key, oldData);
                    // Optionally remove the old data to clean up
                    // Commenting this out to be safe - users can manually clear old data later
                    // localStorage.removeItem(key);
                }
            });
        }
