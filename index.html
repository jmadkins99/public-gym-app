<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Laid out at 0.75 zoom rather than 1:1. Same value and same reasoning as
         the personal app's index.html, which carries the long version: every
         size in the stylesheet is a fixed px, so the layout viewport alone sets
         how dense the page reads, and 0.75 opens it to ~524 px on a phone.
         Keeping the two apps on one number is the point -- a difference here is
         exactly what made the two look like different apps on two phones.

         A page zoom saved in Safari multiplies with this rather than replacing
         it, so a site still holding 75% has to be reset to 100%. -->
    <meta name="viewport" content="width=device-width, initial-scale=0.75, maximum-scale=0.75, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="app-version" content="2026-04-16-ap-minimalist">
    <title>Gym Tracker</title>
    <!-- Dumbbell mark in the app's accent purple, matching the personal app.
         Inlined as a data URI: no extra request, nothing to cache-bust, and
         SVG stays crisp at 16px in the tab and at any size a browser asks for. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%236a5a8a'%3E%3Crect x='2' y='4' width='7.5' height='24' rx='3'/%3E%3Crect x='22.5' y='4' width='7.5' height='24' rx='3'/%3E%3Crect x='9.5' y='12.5' width='13' height='7' rx='2.5'/%3E%3C/g%3E%3C/svg%3E">
    <!-- Daily accent rotation. Byte-identical to the personal app's
         js/accentColor.js so the two banks cannot drift. Must stay above the
         stylesheet and outside text/babel: Babel transforms asynchronously, so
         a palette applied from the app script would land after first paint and
         flash the default purple on every load. -->
    <script src="js/accentColor.js?v=18"></script>
    <!-- Retint the mark to match the day. Local dev (python3 -m http.server)
         holds the favicon at white so a localhost tab is never confused with the
         live GitHub Pages tab beside it. White is the one tint that stays
         unambiguous now that the live favicon changes daily: it is not a hue at
         all, so no palette can drift into looking like it. With both apps served
         locally the two white tabs are distinguishable by title, not by icon --
         same caveat as before. -->
    <script>
        (function () {
            var icon = document.querySelector("link[rel='icon']");
            if (!icon) return;
            var dev = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
            var tint = dev ? '#ffffff' : (window.accentColor && window.accentColor.paletteFor(new Date()).muted);
            if (tint) icon.setAttribute('href', icon.getAttribute('href').replace('%236a5a8a', '%23' + tint.slice(1)));
        }());
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <link rel="stylesheet" href="css/styles.css?v=18">
</head>
<body>
    <div id="root"></div>

    <!-- One script tag per module, executed in DOCUMENT order (Babel's loader
         breaks at the first unloaded script, so a fast file cannot jump the
         queue). Order is load-bearing in four places: utils.js publishes
         APP_NAMESPACE and `storage`, which firebaseInit.js reads at parse time;
         firebaseConfig.js must precede firebaseInit.js; firebaseInit.js must
         precede storageRepo.js, whose repoReady chain runs at parse time; and
         App.jsx must be LAST because it ends with ReactDOM.render.

         Every local URL carries the same ?v= integer. Bump all of them in one
         edit whenever anything ships -- GitHub Pages caches each file
         independently now, and a stale mix is a broken app. Nothing enforces
         the bump; forgetting it is silent. -->
    <script type="text/babel" src="js/config.js?v=18"></script>
    <script type="text/babel" src="js/utils.js?v=18"></script>
    <script type="text/babel" src="js/clients.js?v=18"></script>
    <script type="text/babel" src="js/firebaseConfig.js?v=18"></script>
    <script type="text/babel" src="js/firebaseInit.js?v=18"></script>
    <script type="text/babel" src="js/storageRepo.js?v=18"></script>
    <script type="text/babel" src="js/migrations.js?v=18"></script>
    <script type="text/babel" src="js/migrations.jessi.js?v=18"></script>
    <script type="text/babel" src="js/plateConfig.js?v=18"></script>
    <script type="text/babel" src="js/plateauLogic.js?v=18"></script>
    <script type="text/babel" src="js/components/SetupWizard.jsx?v=18"></script>
    <script type="text/babel" src="js/components/BackupReminderModal.jsx?v=18"></script>
    <script type="text/babel" src="js/components/SettingsModal.jsx?v=18"></script>
    <script type="text/babel" src="js/components/EditWorkoutModal.jsx?v=18"></script>
    <script type="text/babel" src="js/components/TimeDetailsModal.jsx?v=18"></script>
    <script type="text/babel" src="js/components/DayBreakdownModal.jsx?v=18"></script>
    <script type="text/babel" src="js/components/ExerciseCard.jsx?v=18"></script>
    <script type="text/babel" src="js/components/SwipeDeck.jsx?v=18"></script>
    <script type="text/babel" src="js/components/WeeklyView.jsx?v=18"></script>
    <script type="text/babel" src="js/components/App.jsx?v=18"></script>
</body>
</html>
