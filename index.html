            'Preacher Curls',
        ];

        const JESSI_LOWER_ORDER = [
            // Opens Lower as of Aug 2026, matching the personal app. It came up
            // off the end of the day in two steps — first to behind Cable Wrist
            // Curls, then to the front.
            'Back Extensions',
            'Reverse Wrist Curls',
            'Cable Wrist Curls',
            'Ab Crunches',
            'Leg Extensions',
            // Moved ahead of Calf Raises (Aug 2026), matching the personal app.
            'Hip Adduction',
            'Calf Raises',
            // Leg Press closes Lower as of Aug 2026, moved down from behind Leg
            // Extensions — again matching the personal app, where the same
            // movement is the `hip-adduction` id.
            'Leg Press',
        ];

        // Four movements the June Full Body migration dropped, now returning.
        // Each is matched against workoutHistory by the display name it had
        // back then so it can reclaim its ORIGINAL id. This matters: every
        // lookup in this app is `w.exercises.find(e => e.id === exerciseId)`,
        // so handing a returning movement a fresh id would orphan years of
        // weights and leave the client staring at a blank card.
        const JESSI_RESTORED = [
            { name: 'Overhead Tricep Extensions', historical: /\bdips?\b|weighted dip|overhead tricep/i },
            { name: 'Lateral Raises',             historical: /lateral raise/i },
            { name: 'Reverse Wrist Curls',        historical: /reverse.*wrist/i },
            { name: 'Cable Wrist Curls',          historical: /cable wrist/i },
        ];

        // Genuinely new movements — no id to reclaim and no history to inherit,
        // unlike JESSI_RESTORED above. Each id is a stable literal rather than a
        // UUID so the coach preset and this migration agree on one key.
        //   - Preacher Curls: the existing "Recline Curls" IS the old Preacher
        //     Curls, renamed by the June migration, so `preacher-curls` is spoken
        //     for. Hence `actual-`.
        //   - Leg Extensions: added Aug 2026, alongside the personal app, which
        //     hit the same collision (its `leg-extensions` id renders as Hip
        //     Adduction). Both apps share the one `actual-leg-extensions` literal.
        //     No getWeightBreakdownConfig rule needed — its name already matches
        //     the pin-stack branch.
        //
        // startingWeight seeds the weight input until it is logged once. It is
        // deliberately NOT a synthetic history entry: fabricating a workout
        // would show up as a real session in the Weekly tab, count toward PR
        // baselines and day totals, and sync a bogus doc to Firestore.
        const JESSI_NEW_EXERCISES = [
            { id: 'actual-preacher-curls', name: 'Preacher Curls', startingWeight: '50' },
            { id: 'actual-leg-extensions', name: 'Leg Extensions', startingWeight: '50' },
            // Added Aug 2026 alongside the personal app. No id collision in
            // either app, so both share the plain `chest-press` literal — no
            // `actual-` prefix needed. Her starting weight is 100, not his 200.
            { id: 'chest-press', name: 'Chest Press', startingWeight: '100' },
        ];

        // Weekday map, mirroring the personal app: Lower on Mon/Wed/Fri, Upper
        // on Tue/Thu/Sat and Sunday. Day 1 is Upper, matching the Upper-first
        // ordering the personal app uses.
        const JESSI_SPLIT_SCHEDULE = [
            { dayOfWeek: 'Monday',    workoutDayNumber: 2 },
            { dayOfWeek: 'Tuesday',   workoutDayNumber: 1 },
            { dayOfWeek: 'Wednesday', workoutDayNumber: 2 },
            { dayOfWeek: 'Thursday',  workoutDayNumber: 1 },
            { dayOfWeek: 'Friday',    workoutDayNumber: 2 },
            { dayOfWeek: 'Saturday',  workoutDayNumber: 1 },
            { dayOfWeek: 'Sunday',    workoutDayNumber: 1 },
        ];

        // Bump to push any code-side change to Jessi's program — a reorder, a
        // new movement, a dropped one — out to devices that already have a
        // saved config, including signed-in ones. This replaced
        // JESSI_ORDER_REVISION, which only ever understood the single Full
        // Body day and went inert the moment the split landed.
        //
        // The sentinel-gated migrations (jessiFullBodyMigrationApplied<N>) all
        // sit inside `if (repo.mode === 'local')`, so on a signed-in device
        // they never run and bumping one is a no-op. This counter is the only
        // path that reaches the client's phone.
        //
        // 1 = the Aug 2026 Upper/Lower split as shipped. 2 adds Leg Extensions
        // to Lower; the re-run branch below is what picks it up on installs that
        // already took revision 1. 3 adds Chest Press to Upper and moves Incline
        // Chest Press up behind Overhead Tricep Extensions — the move is a pure
        // reorder, so 3 is the only thing that carries it to an existing device.
        // 4 moves Shoulder Press up behind Lateral Raises and makes it a pin
        // stack, likewise reorder-only and reachable only via the bump. 5 swaps
        // Chest Press and Incline Chest Press — same names, same count, so the
        // bump is the whole delivery mechanism. 6 moves Leg Press up behind Leg
        // Extensions, likewise reorder-only and reachable only via the bump.
        // (The equipment reclassification that shipped with 6 needs no revision
        // at all — getWeightBreakdownConfig reads display names live on every
        // render and never touches the saved config.) 7 moves Back Extensions
        // up behind Cable Wrist Curls and Hip Adduction ahead of Calf Raises —
        // same names, same count, so the bump is the whole delivery mechanism.
        // 8 takes Back Extensions the rest of the way to the front of Lower,
        // ahead of both wrist curls; reorder-only again, so again the bump is
        // the only thing that reaches the client's phone. 9 sends Leg Press the
        // other way, from behind Leg Extensions to the very end of Lower — a
        // pure reorder for the fourth time, so the bump is again the whole
        // delivery mechanism. (Leg Press also reverts to two-side plate-loaded
        // with 9, but as with the reclassification that shipped alongside 6,
        // that part needs no revision: getWeightBreakdownConfig reads display
        // names live on every render and never touches the saved config.)
        const JESSI_SPLIT_REVISION = 9;

        const jessiNorm = (s) => String(s || '').toLowerCase().trim();

        // Recover a dropped exercise's original id from workout history, newest
        // entry first so the most recent id wins if the movement was ever
        // re-created. Returns null when the client has no history for it.
        function findHistoricalExerciseId(workoutHistory, pattern) {
            if (!Array.isArray(workoutHistory)) return null;
            const sorted = [...workoutHistory]
                .filter(w => w && Array.isArray(w.exercises))
                .sort((a, b) => new Date(b.date) - new Date(a.date));
            for (const workout of sorted) {
                for (const ex of workout.exercises) {
                    if (ex && ex.id && pattern.test(String(ex.name || ''))) return ex.id;
                }
            }
            return null;
        }

        // Split Jessi's single Full Body day into Upper (day 1) and Lower
        // (day 2), restoring the four dropped movements and adding Preacher
        // Curls. Pure: returns { config, schedule, recoveredIds } to persist,
        // or null when there is nothing to do. `schedule` is null when the
        // caller should leave the saved schedule alone.
        //
        // Handles TWO entry shapes, because it has to keep working after it
        // has already run once:
        //
        //   1. First run — the single Full Body day. Scoped by exercise NAME
        //      to Jessi's program specifically: it only fires when all 14
        //      canonical Full Body names are present, which no other coach
        //      preset or self-setup program satisfies (graciepoo shares none
        //      of the names; noah is already two days).
        //   2. Re-run — a config this function itself produced, identified by
        //      the splitRevision stamp. Re-sorts both days to the current
        //      JESSI_*_ORDER and picks up any newly added movement. Without
        //      this branch a bumped JESSI_SPLIT_REVISION would hit the
        //      single-day guard and silently do nothing, leaving no lever at
        //      all to reorder his program.
        //
        // Ids, weights, rep ranges and every top-level flag pass through
        // untouched — workoutHistory and PR lookups key on id, never position.
        function migrateJessiToUpperLower(config, workoutHistory, schedule) {
            if (!config || config.version !== 2 || !config.days) return null;
            if (config.splitRevision === JESSI_SPLIT_REVISION) return null;

            const dayKeys = Object.keys(config.days).sort((a, b) => Number(a) - Number(b));
            const alreadySplit = config.splitRevision !== undefined;
            let existing;

            if (alreadySplit) {
                // Flatten both days back into one list; the take() calls below
                // re-derive which movement belongs to which day from scratch.
                existing = dayKeys.reduce((all, k) => all.concat(config.days[k] || []), []);
            } else {
                if (dayKeys.length !== 1) return null;
                existing = config.days[dayKeys[0]] || [];
                const present = new Set(existing.map(e => jessiNorm(e.name)));
                if (!JESSI_FULL_BODY_ORDER.every(n => present.has(jessiNorm(n)))) return null;
            }

            const byName = new Map(existing.map(e => [jessiNorm(e.name), e]));
            const recoveredIds = {};

            // Bring back the four dropped movements, reusing their old ids.
            for (const spec of JESSI_RESTORED) {
                if (byName.has(jessiNorm(spec.name))) continue;
                const recovered = findHistoricalExerciseId(workoutHistory, spec.historical);
                recoveredIds[spec.name] = recovered;
                byName.set(jessiNorm(spec.name), {
                    id: recovered || generateUUID(),
                    name: spec.name,
                    typeId: 'standard',
                    sets: 1,
                    minReps: 6,
                    maxReps: 8,
                    order: 0,
                });
            }

            // Add the genuinely new movements.
            for (const spec of JESSI_NEW_EXERCISES) {
                if (byName.has(jessiNorm(spec.name))) continue;
                byName.set(jessiNorm(spec.name), {
                    id: spec.id,
                    name: spec.name,
                    typeId: 'standard',
                    sets: 1,
                    minReps: 6,
                    maxReps: 8,
                    startingWeight: spec.startingWeight,
                    order: 0,
                });
            }

            const take = (names, category) => names
                .map(n => byName.get(jessiNorm(n)))
                .filter(Boolean)
                .map((ex, order) => ({ ...ex, category, order }));

            const upper = take(JESSI_UPPER_ORDER, 'Upper');
            const lower = take(JESSI_LOWER_ORDER, 'Lower');

            // Anything the client added themselves that isn't on either list.
            // Kept rather than dropped, appended to Lower in its existing
            // relative order — the shorter day, and never silently discarded.
            const placed = new Set([...JESSI_UPPER_ORDER, ...JESSI_LOWER_ORDER].map(jessiNorm));
            const extras = existing
                .filter(e => !placed.has(jessiNorm(e.name)))
                .map((ex, i) => ({ ...ex, category: 'Lower', order: lower.length + i }));

            return {
                config: {
                    ...config,
                    days: { 1: upper, 2: lower.concat(extras) },
                    categories: ['Upper', 'Lower'],
                    splitRevision: JESSI_SPLIT_REVISION,
                },
                // Only rewrite the schedule when the split is first applied.
                // A later revision bump is a program edit, not a calendar
                // change, and stomping the schedule every time would undo any
                // day the client had since moved for themselves.
                schedule: alreadySplit ? null : {
                    ...(schedule || {}),
                    workoutDays: JESSI_SPLIT_SCHEDULE.map(d => ({ ...d })),
                    totalWorkoutDays: 2,
                    scheduleIsExplicit: true,
                },
                recoveredIds,
            };
        }

        // Collapse Jessi's exerciseConfig into a single "Full Body" day. Handles
        // any of her prior shapes (Anterior/Posterior, Push/Pull/Legs, Torso/Limbs,
        // or an already-migrated Full Body that needs the flag-2 fixes).
        // Drops four exercises that are not in the new program: lateral raises,
        // reverse wrist curls, cable wrist curls, dips. Their workoutHistory
        // entries remain in storage but won't display in the program. Renames
        // "Leg Extensions" → "Hip Adduction" to match the personal-app display.
        // Also collapses the schedule so every workout day points to dayNumber 1.
        // Gated by jessiFullBodyMigrationApplied5 (bumped for the 14-slot
        // reorder and the Preacher Curls -> Recline Curls rename).
        function migrateJessiToFullBody() {
            if (storage.getItem('jessiFullBodyMigrationApplied5') === 'true') return;

            const raw = storage.getItem('gymExerciseConfig');
            if (!raw) return;
            let config;
            try { config = JSON.parse(raw); } catch (e) { return; }

            if (config.version !== 2 || !config.days) return;
            const cats = (config.categories || []).map(c => String(c).toLowerCase());
            const isAP = cats.length === 2 && cats.includes('anterior') && cats.includes('posterior');
            const isTL = cats.length === 2 && cats.includes('torso') && cats.includes('limbs');
            const isFB = cats.length === 1 && cats.includes('full body');
            if (!isAP && !isTL && !isFB) return;

            const allExercises = Object.values(config.days).flat();

            // Drop four exercises that aren't in the new program. `dip` matches
            // "Dips" / "Weighted Dips" / "Overhead Tricep Extension" — Jessi's
            // historical names for the movement the personal app also dropped.
            const isDropped = (name) => {
                const n = String(name || '').toLowerCase();
                return /lateral raise|reverse.*wrist|cable wrist|\bdip|weighted dip|overhead tricep/.test(n);
            };

            // Display-name rewrites to mirror personal-app naming.
            const renameDisplay = (name) => {
                const n = String(name || '').toLowerCase();
                if (/leg extension/.test(n))              return 'Hip Adduction';
                if (/tricep pushdown|^pushdown$/.test(n)) return 'Tricep Extensions';
                if (/shoulder press/.test(n))             return 'Shoulder Press';
                if (/ab crunch|crunch/.test(n))           return 'Ab Crunches';
                if (/preacher|recline/.test(n))           return 'Recline Curls';
                return name;
            };

            // Canonical order for Jessi's Full Body program (14 slots, as run
            // July 2026). Runs AFTER renameDisplay, so it matches post-rename
            // names ("Recline Curls", "Tricep Extensions", "Ab Crunches") as
            // well as the legacy names still sitting in older configs.
            // Anything unrecognized falls to 999 and lands at the bottom
            // rather than being dropped.
            const getDesiredOrder = (name) => {
                const n = String(name || '').toLowerCase();
                if (/chest fl/.test(n))                        return 0;
                if (/preacher|recline/.test(n))                return 1;
                if (/frontal/.test(n))                         return 2;
                if (/incline/.test(n))                         return 3;
                if (/transverse|upper back row/.test(n))       return 4;
                if (/kelso|shrug/.test(n))                     return 5;
                if (/sagittal|seated row|hammer row/.test(n))  return 6;
                if (/tricep pushdown|pushdown|tricep ext/.test(n)) return 7;
                if (/ab crunch|crunch/.test(n))                return 8;
                if (/shoulder press/.test(n))                  return 9;
                if (/calf/.test(n))                            return 10;
                if (/hip adduction|leg extension/.test(n))     return 11;
                if (/stiff legged|deadlift|back extension/.test(n)) return 12;
                if (/pendulum|squat|leg press/.test(n))        return 13;
                return 999;
            };

            const kept = allExercises
                .filter(ex => !isDropped(ex.name))
                .map(ex => ({ ...ex, name: renameDisplay(ex.name), category: 'Full Body' }))
                .sort((a, b) => getDesiredOrder(a.name) - getDesiredOrder(b.name))
                .map((ex, idx) => ({ ...ex, order: idx }));

            const newConfig = {
                ...config,
                version: 2,
                days: { 1: kept },
                categories: ['Full Body']
            };

            storage.setItem('gymExerciseConfig', JSON.stringify(newConfig));

            // Collapse schedule so every weekday-mapped workout points to day 1.
            const rawSchedule = storage.getItem('gymScheduleConfig');
            if (rawSchedule) {
                try {
                    const sched = JSON.parse(rawSchedule);
                    if (sched && Array.isArray(sched.workoutDays)) {
                        const updatedSchedule = {
                            ...sched,
                            workoutDays: sched.workoutDays.map(d => ({ ...d, workoutDayNumber: 1 })),
                            totalWorkoutDays: 1
                        };
                        storage.setItem('gymScheduleConfig', JSON.stringify(updatedSchedule));
                    }
                } catch (e) { /* leave schedule alone */ }
            }

            storage.setItem('jessiFullBodyMigrationApplied5', 'true');
        }

        // One-shot: auto-enable gympinMode for Jessi's installs without requiring
        // ?gympin=on. We identify "Jessi-shaped" by the same signal the TL
        // migration uses: an exerciseConfig whose categories are Anterior/
        // Posterior or Torso/Limbs (no other user picks those in the wizard).
        // Gated by its own flag so it's independent of TL migration bumps.
        function enableGympinForJessi() {
            if (storage.getItem('jessiGympinEnabled') === 'true') return;

            const raw = storage.getItem('gymExerciseConfig');
            if (!raw) return;
            let config;
            try { config = JSON.parse(raw); } catch (e) { return; }

            if (config.version !== 2 || !config.days) return;
            const cats = (config.categories || []).map(c => String(c).toLowerCase());
            const isAP = cats.length === 2 && cats.includes('anterior') && cats.includes('posterior');
            const isTL = cats.length === 2 && cats.includes('torso') && cats.includes('limbs');
            const isFB = cats.length === 1 && cats.includes('full body');
            if (!isAP && !isTL && !isFB) return;

            config.gympinMode = true;
            storage.setItem('gymExerciseConfig', JSON.stringify(config));
            storage.setItem('jessiGympinEnabled', 'true');
        }

        // One-shot: turn the standard card's Reps field into a 5-8 dropdown for
        // Jessi, mirroring the personal app's 3-6 dropdown. Same Jessi-shaped
        // signal as enableGympinForJessi, own flag so the two stay independent.
        //
        // The range extends one BELOW his 6-8 goal range so a set that missed
        // the floor can be recorded; minReps is display-only and never feeds
        // the progression logic. The top of the range is his maxReps, so the
        // last option is exactly the getMinimalistPR trigger (reps >= 8 bumps
        // the weight) — same relationship the personal app's 3-6 dropdown has
        // to its own bump at 6.
        function enableRepsDropdownForJessi() {
            if (storage.getItem('jessiRepsDropdownEnabled') === 'true') return;

            const raw = storage.getItem('gymExerciseConfig');
            if (!raw) return;
            let config;
            try { config = JSON.parse(raw); } catch (e) { return; }

            if (config.version !== 2 || !config.days) return;
            const cats = (config.categories || []).map(c => String(c).toLowerCase());
            const isAP = cats.length === 2 && cats.includes('anterior') && cats.includes('posterior');
            const isTL = cats.length === 2 && cats.includes('torso') && cats.includes('limbs');
            const isFB = cats.length === 1 && cats.includes('full body');
            if (!isAP && !isTL && !isFB) return;

            config.repsDropdown = { min: 5, max: 8 };
            storage.setItem('gymExerciseConfig', JSON.stringify(config));
            storage.setItem('jessiRepsDropdownEnabled', 'true');
        }

        // ============================================================================
        // GYMPIN: Weight Breakdown
        // ============================================================================
        // Opt-in feature for coached users (currently just Jessi). Enabled via the
        // `gympinMode` field on exerciseConfig. Set it once on the user's device
        // by visiting the app with `?gympin=on` (or `?gympin=off` to disable);
        // the App component picks the param up on mount, flips the flag, and
        // strips the param from the URL. The flag travels with the user's
        // exerciseConfig backup so it survives restore.

        // Classify a Jessi-style exercise display name into a weight-breakdown
        // config. Mirrors gym_app/js/config.js: pin-stack machines (with optional
        // overflow above a cap) and plate-loaded machines (one- or two-sided).
        // Unknown names return null and don't get a breakdown button.
        function getWeightBreakdownConfig(name) {
            const n = String(name || '').toLowerCase();

            // Plate-loaded — checked before pin-stack. one-sided = plates hang
            // on one arm, total = perSide; two-sided = plates on both arms,
            // total = 2 * perSide.
            //
            // Incline Chest Press used to sit here as two-sided plate-loaded,
            // and this block led with it so a generic chest rule couldn't steal
            // it. Aug 2026 moved it to a pin stack in both apps, so the rule is
            // gone and the /chest press/ pin-stack rule below now deliberately
            // catches BOTH "Chest Press" and "Incline Chest Press".
            // Jessi's preacher station is renamed "Recline Curls" and is a pin
            // stack (see below); this plate-loaded rule is for everyone else's.
            if (/preacher/.test(n))              return { type: 'plate-loaded', plateMode: 'one-sided' };
            if (/stiff legged|deadlift/.test(n)) return { type: 'plate-loaded', plateMode: 'two-sided' };
            if (/pendulum|squat/.test(n))        return { type: 'plate-loaded', plateMode: 'one-sided' };
            // Back Extensions moved from a single-plate station to a two-side
            // plate-loaded one (Aug 2026), matching the personal app. The
            // logged number is now the total across both arms.
            if (/back extension/.test(n))        return { type: 'plate-loaded', plateMode: 'two-sided' };
            // Leg Press is back here after a brief stint as a pin stack in Aug
            // 2026, matching the personal app's `hip-adduction` revert. It must
            // stay in THIS block: the pin-stack rules below run second, so a
            // duplicate /leg press/ rule down there would be dead code rather
            // than a conflict — and the live one would be this, silently.
            if (/leg press/.test(n))             return { type: 'plate-loaded', plateMode: 'two-sided' };
            if (/hammer row|sagittal/.test(n))   return { type: 'plate-loaded', plateMode: 'one-sided' };
            if (/transverse|upper back row/.test(n))
                                                 return { type: 'plate-loaded', plateMode: 'one-sided' };
            if (/kelso|shrug/.test(n))           return { type: 'plate-loaded', plateMode: 'one-sided' };

            // Pin-stack with overflow cap — cable wrist curls maxes at 97.5 then
            // accepts hanging plates one-sided.
            if (/cable wrist curl/.test(n))
                return { type: 'pin-stack', maxPin: 97.5, overflowPlateMode: 'one-sided' };

            // Plain pin-stack — any other Jessi-program movement that uses a stack.
            if (/recline/.test(n))                                 return { type: 'pin-stack' };
            if (/chest fl/.test(n))                                return { type: 'pin-stack' };
            // Matches "Chest Press" and "Incline Chest Press" alike — both are
            // pin stacks as of Aug 2026, as is Shoulder Press.
            if (/chest press/.test(n))                             return { type: 'pin-stack' };
            if (/shoulder press/.test(n))                          return { type: 'pin-stack' };
            if (/frontal plane|pulldown/.test(n))                  return { type: 'pin-stack' };
            if (/seated row/.test(n))                              return { type: 'pin-stack' };
            if (/lateral raise/.test(n))                           return { type: 'pin-stack' };
            // "Dips" / "Weighted Dips" are Jessi's historical names for the
            // movement now called Overhead Tricep Extensions. It is a pin stack,
            // matching the personal app; it was misclassified as plate-loaded
            // two-sided back when the display name was still "Dips".
            if (/\bdip|weighted dip|overhead tricep/.test(n))      return { type: 'pin-stack' };
            if (/tricep pushdown|pushdown|tricep ext/.test(n))     return { type: 'pin-stack' };
            if (/reverse.*wrist|wrist curl/.test(n))               return { type: 'pin-stack' };
            if (/ab crunch|crunch/.test(n))                        return { type: 'pin-stack' };
            if (/calf/.test(n))                                    return { type: 'pin-stack' };
            if (/leg extension|hip adduction/.test(n))             return { type: 'pin-stack' };
            // No /leg press/ rule here: it was a pin stack for part of Aug 2026
            // and is two-side plate-loaded again, up in the plate block. Note
            // /leg extension/ above does NOT catch "Leg Press", so removing the
            // rule leaves the name to the plate block rather than to `null`.

            return null;
        }

        // Break `weight` into the largest combination of standard plates that
        // doesn't exceed it. Used for both plate-loaded sets and the overflow
        // portion of pin-stack-with-cap. Returns { 45: count, 25: count, ... }.
        function gympinBreakdownPlatesFloor(weight) {
            const available = [45, 25, 10, 5, 2.5, 1.25];
            const plates = {};
            let remaining = weight;
            for (const p of available) {
                const count = Math.floor(remaining / p);
                if (count > 0) {
                    plates[p] = count;
                    remaining = parseFloat((remaining - count * p).toFixed(2));
                }
            }
            return plates;
        }

        // Plate-loaded breakdown — mirrors gym_app's calculatePlateBreakdown.
        function gympinCalculatePlateBreakdown(totalWeight, config) {
            const isTwoSided = config.plateMode === 'two-sided';
            const perSide = (w) => isTwoSided ? w / 2 : w;
            // Warmup per-side weights round to the nearest 10 lb (an exact halfway
            // value rounds DOWN) so warmups load with clean plates and no 2.5/1.25
            // micro-plates. The top set is never rounded — it shows the exact
            // working weight. Mirrors gym_app calculatePlateBreakdown.
            const roundWarmupPerSide = (w) => {
                const base = Math.floor(w / 10) * 10;
                const remainder = parseFloat((w - base).toFixed(4));
                return remainder > 5 ? base + 10 : base;
            };
            const buildSet = (target, roundWarmup) => {
                const ps = roundWarmup ? roundWarmupPerSide(perSide(target)) : perSide(target);
                return {
                    totalWeight: isTwoSided ? ps * 2 : ps,
                    perSideWeight: ps,
                    plates: gympinBreakdownPlatesFloor(ps),
                };
            };
            return {
                isTwoSided,
                warmup1: buildSet(totalWeight * 0.7, true),
                warmup2: buildSet(totalWeight * 0.9, true),
                topSet:  buildSet(totalWeight, false),
            };
        }

        // Pin-stack breakdown — mirrors gym_app's calculatePinStackBreakdown.
        // For pin-stack-with-cap exercises, sets above maxPin show "pin at max
        // + plates for the excess" (plates rounded DOWN to clean combinations).
        function gympinCalculatePinStackBreakdown(totalWeight, config) {
            const maxPin = (config && config.maxPin) || null;
            const roundPin = (weight) => {
                const base = Math.floor(weight / 5) * 5;
                const r = weight - base;
                if (r < 0.625)      return base;
                else if (r < 1.875) return base + 1.25;
                else if (r < 3.125) return base + 2.5;
                else if (r < 4.375) return base + 3.75;
                else                return base + 5;
            };
            const buildSet = (target) => {
                if (maxPin === null || target <= maxPin) {
                    const w = roundPin(target);
                    return { overflow: false, pinWeight: w, totalWeight: w };
                }
                const plates = gympinBreakdownPlatesFloor(target - maxPin);
                const plateTotal = Object.entries(plates)
                    .reduce((s, [p, c]) => s + parseFloat(p) * c, 0);
                return {
                    overflow: true,
                    pinWeight: maxPin,
                    plates,
                    totalWeight: parseFloat((maxPin + plateTotal).toFixed(2)),
                };
            };
            return {
                warmup1: buildSet(totalWeight * 0.7),
                warmup2: buildSet(totalWeight * 0.9),
                topSet:  buildSet(totalWeight),
            };
        }

        function createDefaultSchedule() {
            // Create a 2-day alternating schedule to preserve old behavior
            const defaultSchedule = {
                version: 2,
                workoutDays: [
                    { dayOfWeek: 'Monday', workoutDayNumber: 1 },
                    { dayOfWeek: 'Wednesday', workoutDayNumber: 2 },
                    { dayOfWeek: 'Friday', workoutDayNumber: 1 },
                    { dayOfWeek: 'Saturday', workoutDayNumber: 2 }
                ],
                totalWorkoutDays: 2
            };

            storage.setItem('gymScheduleConfig', JSON.stringify(defaultSchedule));
        }

        // ============================================================================
        // APP COMPONENT
        // ============================================================================

        function App() {
            const [currentView, setCurrentView] = useState('workout');
            const [currentDay, setCurrentDay] = useState(1);
            const [workoutData, setWorkoutData] = useState({});
            const [loggedExercises, setLoggedExercises] = useState({});
            const [workoutHistory, setWorkoutHistory] = useState([]);
            const [showSuccess, setShowSuccess] = useState(false);
            const [successMessage, setSuccessMessage] = useState('');
            const [exercisesByDay, setExercisesByDay] = useState({});
            const [schedule, setSchedule] = useState(null);
            const [exerciseCategories, setExerciseCategories] = useState([]);
            const [prTracking, setPrTracking] = useState(false);
            const [advancedPrTracking, setAdvancedPrTracking] = useState(false);
            const [minimalistPrTracking, setMinimalistPrTracking] = useState(false);
            const [gympinMode, setGympinMode] = useState(false);
            // { min, max } turns the standard card's free-type Reps field into a
            // dropdown of that inclusive range. null = free-type (everyone else).
            const [repsDropdown, setRepsDropdown] = useState(null);
            const [expandedWeightBreakdown, setExpandedWeightBreakdown] = useState(null);
            const [selectedExercise, setSelectedExercise] = useState('');
            const [celebration, setCelebration] = useState(null);
            const [showSettings, setShowSettings] = useState(false);
            const [showBackupReminder, setShowBackupReminder] = useState(false);
            const [showTutorial, setShowTutorial] = useState(false);
            const [showDayBreakdown, setShowDayBreakdown] = useState(false);
            const [showEditWorkout, setShowEditWorkout] = useState(false);
            const [editingWorkout, setEditingWorkout] = useState(null);
            const [viewingWeek, setViewingWeek] = useState(1);
            const [showWizard, setShowWizard] = useState(false);
            const [fieldErrors, setFieldErrors] = useState({});
            const [hydrated, setHydrated] = useState(false);
            const [showSyncPrompt, setShowSyncPrompt] = useState(false);
            const currentWeek = useMemo(() => getCurrentWeek(workoutHistory), [workoutHistory]);
            const hasMigratedWeeks = useRef(false);

            useEffect(() => {
                window.repoReady.then((repo) => {
                // Legacy localStorage-era migrations. Only meaningful in local

                if (repo.mode === 'local') {
                // Migrate existing data to namespaced storage (one-time for existing users)
                migrateToNamespacedStorage();

                // One-shot Anterior/Posterior migration for Jessi's PPL data
                migrateJessiToAnteriorPosterior();

                // One-shot Torso/Limbs migration for Jessi's Anterior/Posterior data
                migrateJessiToFullBody();

                // One-shot auto-enable of gympin Weight Breakdown for Jessi
                enableGympinForJessi();

                // One-shot auto-enable of the 5-8 reps dropdown for Jessi
                enableRepsDropdownForJessi();

                // Check if setup is completed
                const setupCompleted = storage.getItem('gymSetupCompleted');

                if (!setupCompleted) {
                    // Check if user has existing data

                    const hasConfig = storage.getItem('gymExerciseConfig');

                    if (hasHistory || hasConfig) {
                        // Existing user - auto-migrate
                        migrateExerciseConfig();
                        migrateWorkoutHistory();
                        createDefaultSchedule();

                        // Mark setup as completed
                        storage.setItem('gymSetupCompleted', JSON.stringify({
                            version: 1,
                            completed: true,
                            completedAt: new Date().toISOString(),

                        setShowWizard(true);
                        setHydrated(true);

                }

                return repo.loadAll().then(({ workoutHistory: savedHistory, exerciseConfig: savedConfig, scheduleConfig: savedSchedule, setupCompleted: savedSetup }) => {
                // Cloud mode, nothing set up yet (brand-new client on a fresh

                if (repo.mode !== 'local' && !savedSetup) {

                    setHydrated(true);

                    params.delete('gympin');
                    const cleanUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
                    window.history.replaceState({}, '', cleanUrl);

                // Load workout history
                if (savedHistory) {
                    setWorkoutHistory(savedHistory);

                // Load workout schedule
                if (savedSchedule) {
                    setSchedule(savedSchedule);
                }

                // Load custom exercise configurations
                if (savedConfig) {
                    // Aug 2026: split Full Body into Upper/Lower, and apply any

                    // signed-in device this is the only path that can change
                    // the program, since the legacy sentinel migrations above
                    // are gated on repo.mode === 'local'. Needs the loaded

                    const split = migrateJessiToUpperLower(savedConfig, savedHistory, savedSchedule);
                    if (split) {

                        repo.saveExerciseConfig(split.config);
                        if (split.schedule) {
                            repo.saveScheduleConfig(split.schedule);
                            setSchedule(split.schedule);
                        }
                        console.log('[Jessi Upper/Lower] applied; recovered ids:', split.recoveredIds);
                    }

                    const config = savedConfig;

                    // Check for version 2 format (from wizard)
                    if (config.version === 2 && config.days) {
                        // Sort exercises in each day by order
                        const sortedDays = {};
                        Object.keys(config.days).forEach(dayNum => {
                            sortedDays[dayNum] = config.days[dayNum].sort((a, b) => a.order - b.order);
                        });
                        setExercisesByDay(sortedDays);

                        // Set first exercise as selected for progress view
                        const allExercises = Object.values(sortedDays).flat();
                        if (allExercises.length > 0 && !selectedExercise) {
                            setSelectedExercise(allExercises[0].id);
                        }

                        if (config.categories) {
                            setExerciseCategories(config.categories);
                        }

                        // Load prTracking flags
                        if (config.prTracking !== undefined) {
                            setPrTracking(config.prTracking);
                        }
                        if (config.advancedPrTracking !== undefined) {
                            setAdvancedPrTracking(config.advancedPrTracking);
                        }
                        if (config.minimalistPrTracking !== undefined) {
                            setMinimalistPrTracking(config.minimalistPrTracking);
                        }
                        if (config.gympinMode !== undefined) {
                            setGympinMode(config.gympinMode);
                        }
                        if (config.repsDropdown !== undefined) {
                            setRepsDropdown(config.repsDropdown);
                        }
                    }
                    // Fallback to old format for backward compatibility
                    else if (config.day1 || config.day2) {
                        const days = {};
                        if (config.day1) {
                            days[1] = config.day1.sort((a, b) => a.order - b.order);
                        }
                        if (config.day2) {
                            days[2] = config.day2.sort((a, b) => a.order - b.order);
                        }
                        setExercisesByDay(days);

                        // Set first exercise as selected for progress view
                        const allExercises = Object.values(days).flat();
                        if (allExercises.length > 0 && !selectedExercise) {
                            setSelectedExercise(allExercises[0].id);
                        }
                    }
                }

                // Check last backup reminder (monthly only, not on first time)
                const lastReminder = storage.getItem('lastBackupReminder');
                const now = new Date().getTime();
                const oneMonth = 30 * 24 * 60 * 60 * 1000;

                if (lastReminder && (now - parseInt(lastReminder)) > oneMonth) {
                    setShowBackupReminder(true);
                }

                // Cloud sync available, signed out, and setup already complete
                // (reaching here means the wizard was passed — i.e. a coached

                // once, dismissible, never blocking the workout flow.
                if (window.FIREBASE_READY && repo.mode === 'local' &&
                    !storage.getItem('syncPromptDismissed')) {
                    setShowSyncPrompt(true);
                }

                setHydrated(true);
                });
                });
            }, []);

            // Update viewing week and migrate workout history when it loads
            useEffect(() => {
                if (workoutHistory.length > 0 && !hasMigratedWeeks.current) {
                    // Clear the cached first workout Monday to recalculate based on actual data
                    storage.removeItem('firstWorkoutMonday');

                    // Recalculate and migrate week numbers for all workouts
                    const migratedHistory = workoutHistory.map(workout => ({
                        ...workout,
                        week: getWeekNumber(workout.date, workoutHistory)
                    }));

                    // Only update if week numbers actually changed
                    const hasChanges = migratedHistory.some((workout, idx) =>
                        workout.week !== workoutHistory[idx].week
                    );

                    if (hasChanges) {
                        setWorkoutHistory(migratedHistory);
                        window.repo.saveHistory(migratedHistory);
                    }

                    // Set viewing week to current week
                    setViewingWeek(currentWeek);

                    // Mark migration as complete
                    hasMigratedWeeks.current = true;
                }

            //
            // For an EXPLICIT weekday schedule, prefer whatever today maps to,
            // so a program like Upper on Tue/Thu/Sat actually opens on Upper
            // on a Tuesday. The old behavior always took workoutDays[0], which
            // meant a two-day split opened on whichever day happened to be
            // listed first regardless of the date.
            //
            // Non-explicit schedules keep the first-entry behavior unchanged,

            useEffect(() => {
                if (schedule && schedule.workoutDays && schedule.workoutDays.length > 0) {
                    const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday',
                                      'Thursday', 'Friday', 'Saturday'];
                    const todayName = dayNames[new Date().getDay()];
                    const todayEntry = schedule.scheduleIsExplicit
                        ? schedule.workoutDays.find(wd => wd.dayOfWeek === todayName)
                        : null;
                    setCurrentDay(todayEntry
                        ? todayEntry.workoutDayNumber
                        : schedule.workoutDays[0].workoutDayNumber);
                }
            }, [schedule]);

            // Restore logged state and workout data from today's workout
            useEffect(() => {
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                const todayWorkout = workoutHistory.find(w => {
                    const workoutDate = new Date(w.date);
                    workoutDate.setHours(0, 0, 0, 0);
                    const isSameDay = workoutDate.getTime() === today.getTime();
                    const isSameWorkoutDay = w.day === currentDay;
                    return isSameDay && isSameWorkoutDay;
                });

                if (todayWorkout && !todayWorkout.submitted) {
                    // Only restore state if workout hasn't been submitted yet
                    const newLoggedExercises = {};
                    const newWorkoutData = {};

                    todayWorkout.exercises.forEach(exercise => {
                        let hasData = false;

                        if (exercise.type === 'assault-bike') {
                            hasData = exercise.rounds && exercise.rounds.trim() !== '';
                        } else if (exercise.type === 'stairmaster') {
                            hasData = exercise.time && exercise.time.trim() !== '';
                        } else if (exercise.isCardio || exercise.type === 'cardio') {

                                      (exercise.seconds && exercise.seconds > 0);
                        } else if (exercise.type === 'bodyweight') {
                            hasData = exercise.reps && exercise.reps.toString().trim() !== '';
                        } else {
                            hasData = (exercise.weight && exercise.weight.toString().trim() !== '') ||
                                      (exercise.reps && exercise.reps.toString().trim() !== '');
                        }

                        if (hasData) {
                            newLoggedExercises[exercise.id] = true;

                            if (exercise.type === 'assault-bike') {
                                newWorkoutData[exercise.id] = { rounds: exercise.rounds };
                            } else if (exercise.type === 'stairmaster') {
                                newWorkoutData[exercise.id] = { time: exercise.time, level: exercise.level || 'Level 7' };
                            } else if (exercise.isCardio || exercise.type === 'cardio') {
                                newWorkoutData[exercise.id] = {
                                    intensity: exercise.intensity,
                                    minutes: exercise.minutes,
                                    seconds: exercise.seconds
                                };
                            } else if (exercise.type === 'bodyweight') {
                                newWorkoutData[exercise.id] = { reps: exercise.reps };
                            } else {
                                newWorkoutData[exercise.id] = {
                                    weight: exercise.weight,
                                    reps: exercise.reps
                                };
                            }
                        }
                    });

                    setLoggedExercises(newLoggedExercises);
                    setWorkoutData(newWorkoutData);
                } else {
                    // Clear logged state if switching to a day with no workout or if workout is submitted
                    setLoggedExercises({});
                    setWorkoutData({});
                }
            }, [workoutHistory, currentDay]);

            const getCurrentExercises = () => {
                return exercisesByDay[currentDay] || [];

            const getTodayWorkout = () => {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                return workoutHistory.find(w => {
                    const workoutDate = new Date(w.date);
                    workoutDate.setHours(0, 0, 0, 0);
                    const isSameDay = workoutDate.getTime() === today.getTime();
                    const isSameWorkoutDay = w.day === currentDay;
                    return isSameDay && isSameWorkoutDay;
                });
            };

            const isWorkoutSubmitted = () => {
                const todayWorkout = getTodayWorkout();
                return todayWorkout && todayWorkout.submitted;
            };

            // Build a full exercise-config payload, carrying forward any tracking flags
            // stored alongside the config so they survive writes from rename/reorder/etc.
            const buildExerciseConfig = (days) => {
                const existingRaw = storage.getItem('gymExerciseConfig');
                const existing = existingRaw ? (() => { try { return JSON.parse(existingRaw); } catch (e) { return {}; } })() : {};
                return {
                    ...existing,
                    version: 2,
                    days,
                    categories: exerciseCategories,
                    prTracking,
                    advancedPrTracking,
                    minimalistPrTracking,
                    gympinMode,
                    repsDropdown
                };
            };

            const saveExerciseConfig = () => {
                window.repo.saveExerciseConfig(buildExerciseConfig(exercisesByDay));
            };

            const updateExerciseName = (day, exerciseId, newName, additionalProps = {}) => {
                setExercisesByDay(prev => {
                    const updated = {
                        ...prev,
                        [day]: prev[day].map(ex =>
                            ex.id === exerciseId ? { ...ex, name: newName, ...additionalProps } : ex
                        )
                    };
                    window.repo.saveExerciseConfig(buildExerciseConfig(updated));
                    return updated;
                });
            };

            const moveExercise = (day, exerciseId, direction) => {
                const exercises = exercisesByDay[day] || [];
                const currentIndex = exercises.findIndex(ex => ex.id === exerciseId);

                if (direction === 'up' && currentIndex === 0) return;
                if (direction === 'down' && currentIndex === exercises.length - 1) return;

                const newIndex = direction === 'up' ? currentIndex - 1 : currentIndex + 1;
                const reordered = [...exercises];
                [reordered[currentIndex], reordered[newIndex]] = [reordered[newIndex], reordered[currentIndex]];

                // Update order values
                const updated = reordered.map((ex, idx) => ({ ...ex, order: idx }));

                setExercisesByDay(prev => {
                    const updatedDays = {
                        ...prev,
                        [day]: updated
                    };
                    window.repo.saveExerciseConfig(buildExerciseConfig(updatedDays));
                    return updatedDays;
                });
            };

            const getPreviousWorkout = (exerciseId) => {
                if (workoutHistory.length === 0) return null;

                // Collect all sessions that included this exercise (regardless of NA status)
                const lastThreeSessions = [];
                for (let workout of workoutHistory) {
                    const exercise = workout.exercises.find(e => e.id === exerciseId);
                    if (exercise) {
                        lastThreeSessions.push(exercise);
                    }
                }

                // From those, find the most recent one with actual data (non-NA)
                for (let exercise of lastThreeSessions) {
                    let hasData = false;
                    if (exercise.type === 'assault-bike') {
                        hasData = exercise.rounds && exercise.rounds.trim() !== '';
                    } else if (exercise.type === 'stairmaster') {
                        hasData = exercise.time && exercise.time.trim() !== '';
                    } else if (exercise.isCardio || exercise.type === 'cardio') {
                        // For cardio, check that total time is > 0 (not just "0:00")
                        const totalSeconds = ((exercise.minutes || 0) * 60) + (exercise.seconds || 0);
                        hasData = totalSeconds > 0;
                    } else if (exercise.type === 'bodyweight') {
                        hasData = exercise.reps && exercise.reps.toString().trim() !== '';
                    } else {
                        hasData = (exercise.weight && exercise.weight.toString().trim() !== '') ||
                                  (exercise.reps && exercise.reps.toString().trim() !== '');
                    }

                    if (hasData) {
                        return exercise;
                    }
                }

                return null;
            };

            const handleInputChange = (exerciseId, field, value) => {

                    ...prev,

                        ...prev[exerciseId],

                    }
                }));

                // Clear validation error for this field when user types

                        const newErrors = { ...prev };
                        delete newErrors[errorKey];

            };

                let data = workoutData[exerciseId] || {};

                // Capture the reps dropdown's pre-selected value when the user

                // data.reps. No-op for the free-type input (no such <select>).
                if (!data.reps) {
                    const card = document.querySelector(`[data-exercise-id="${exerciseId}"]`);
                    const repsSelect = card && card.querySelector('select[data-field="reps"]');
                    if (repsSelect && repsSelect.value) {
                        data = { ...data, reps: repsSelect.value };
                    }
                }

                // Capture auto-filled weight if user didn't manually enter it
                if ((exercise.type === 'standard' || (!exercise.type && !exercise.isCardio && exercise.typeId !== 'cardio')) && !data.weight && data.reps) {
                    // Find the weight input field for this exercise and read its displayed value
                    const exerciseCard = document.querySelector(`[data-exercise-id="${exerciseId}"]`);
                    if (exerciseCard) {
                        // Find the weight input (it's the first number input with inputmode="decimal")
                        const weightInput = exerciseCard.querySelector('input[type="number"][inputmode="decimal"]');
                        if (weightInput && weightInput.value) {
                            data = { ...data, weight: weightInput.value };
                        }
                    }
                }

                // Validate data based on exercise type and set field errors
                const errors = {};

                // For standard exercises, validate weight and reps
                if (exercise.type === 'standard' || (!exercise.type && !exercise.isCardio && exercise.typeId !== 'cardio')) {
                    if (!data.weight || data.weight.toString().trim() === '') {
                        errors[`${exerciseId}-weight`] = true;
                    }
                    if (!data.reps || data.reps.toString().trim() === '') {
                        errors[`${exerciseId}-reps`] = true;
                    }

                    // If there are validation errors, set them and return
                    if (Object.keys(errors).length > 0) {
                        setFieldErrors(errors);
                        return;
                    }
                }

                if (exercise.type === 'assault-bike' && !data.rounds) return;
                if (exercise.type === 'stairmaster' && !data.time) return;
                if (exercise.type === 'bodyweight' && !data.reps) return;
                if (exercise.isCardio || exercise.typeId === 'cardio') {
                    // Check if minutes is filled (required)
                    if (!data.minutes || data.minutes === 0) {
                        errors[`${exerciseId}-minutes`] = true;
                        setFieldErrors(errors);
                        return;
                    }

                    // For intensity, check if there's a default available (from previous workout or exercise config)
                    const previous = getPreviousWorkout(exerciseId);
                    const hasIntensity = (data.intensity && data.intensity.trim()) ||

                                        (exercise.intensity && exercise.intensity.trim());

                setWorkoutData(prev => ({
                    ...prev,
                    [exerciseId]: finalData
                }));

                const today = new Date();
                today.setHours(0, 0, 0, 0);

                        name: exercise.name,
                        category: exercise.category,
                        type: exercise.type,
                        intensity: '30/30',
                        rounds: finalData.rounds || ''
                    };

                    exerciseToSave = {
                        id: exercise.id,
                        name: exercise.name,
                        category: exercise.category,
                        type: exercise.type,
                        level: finalData.level || 'Level 7',
                        time: finalData.time || ''
                    };
                } else if (exercise.isCardio || exercise.typeId === 'cardio') {
                    exerciseToSave = {
                        id: exercise.id,
                        name: exercise.name,
                        category: exercise.category,
                        type: 'cardio',
                        isCardio: true,
                        intensity: finalData.intensity !== undefined ? finalData.intensity : (exercise.intensity || ''),
                        minutes: finalData.minutes !== undefined ? finalData.minutes : (exercise.minutes || 0),
                        seconds: finalData.seconds !== undefined ? finalData.seconds : (exercise.seconds || 0)
                    };
                } else if (exercise.type === 'bodyweight') {
                    exerciseToSave = {
                        id: exercise.id,
                        name: exercise.name,
                        category: exercise.category,
                        type: exercise.type,
                        weight: 'Body Weight',
                        reps: finalData.reps || '',
                        minReps: exercise.minReps,
                        maxReps: exercise.maxReps
                    };
                } else {
                    exerciseToSave = {
                        id: exercise.id,
                        name: exercise.name,
                        category: exercise.category,
                        type: exercise.type,
                        weight: finalData.weight || '',
                        reps: finalData.reps || '',
                        minReps: exercise.minReps,
                        maxReps: exercise.maxReps
                    };
                }

                let updatedHistory;
                if (existingWorkoutIndex !== -1) {
                    // Update existing workout
                    updatedHistory = [...workoutHistory];
                    const workout = updatedHistory[existingWorkoutIndex];
                    const exerciseIndex = workout.exercises.findIndex(e => e.id === exerciseId);

                    if (exerciseIndex !== -1) {

                    workout.date = timestamp; // Update to latest timestamp
                } else {
                    // Create new workout with all exercises initialized to NA
                    const allExercises = getCurrentExercises().map(ex => {
                        if (ex.id === exerciseId) {

                            // Initialize as NA
                            if (ex.type === 'assault-bike') {
                                return {
                                    id: ex.id,
                                    name: ex.name,
                                    category: ex.category,
                                    type: ex.type,
                                    intensity: '30/30',
                                    rounds: ''
                                };
                            } else if (ex.type === 'stairmaster') {
                                return {
                                    id: ex.id,
                                    name: ex.name,
                                    category: ex.category,
                                    type: ex.type,
                                    level: 'Level 7',
                                    time: ''
                                };
                            } else if (ex.isCardio || ex.typeId === 'cardio') {
                                return {
                                    id: ex.id,
                                    name: ex.name,
                                    category: ex.category,
                                    type: 'cardio',
                                    isCardio: true,
                                    intensity: '',
                                    minutes: 0,
                                    seconds: 0
                                };
                            } else if (ex.type === 'bodyweight') {
                                return {
                                    id: ex.id,
                                    name: ex.name,
                                    category: ex.category,
                                    type: ex.type,
                                    weight: 'Body Weight',
                                    reps: ''
                                };
                            } else {
                                return {
                                    id: ex.id,
                                    name: ex.name,
                                    category: ex.category,
                                    type: ex.type,
                                    weight: '',
                                    reps: ''
                                };

                    });

                        exercises: allExercises,

                    };

                setWorkoutHistory(updatedHistory);
                window.repo.saveHistory(updatedHistory);

                setLoggedExercises(prev => ({
                    ...prev,

                }));

                setShowSuccess(true);
                setTimeout(() => setShowSuccess(false), 2000);

            const completeDay = () => {

                const todayWorkout = getTodayWorkout();

                if (advancedPrTracking) {

                    const findPreviousValidExercise = (exerciseId) => {

                            .filter(w => {
                                if (w.date === todayWorkout.date) return false;
                                if (!w.submitted) return false;
                                return true;
                            })
                            .sort((a, b) => new Date(b.date) - new Date(a.date))
                            .slice(0, 5);
                        for (const workout of previousWorkouts) {
                            const ex = workout.exercises.find(e => e.id === exerciseId);
                            if (ex && ex.reps && ex.reps !== 'NA' &&
                                (ex.type === 'bodyweight' || (ex.weight && ex.weight !== 'NA'))) {
                                return ex;
                            }
                        }
                        return null;
                    };

                    todayWorkout.exercises.forEach(exercise => {
                        if ((exercise.type === 'standard' || exercise.type === 'bodyweight' ||
                            (!exercise.type && !exercise.isCardio)) &&
                            exercise.reps && exercise.reps !== 'NA') {
                            const reps = parseInt(exercise.reps);
                            if (isNaN(reps)) return;

                            const exMinReps = exercise.minReps || 6;
                            const exMaxReps = exercise.maxReps || 8;

                            // Rule 1: below minReps — always plateau buster
                            if (reps < exMinReps) {
                                plateauBusters.push(exercise.id);
                                return;
                            }

                            // Rule 2: in the rep range (minReps to maxReps-1) — plateau buster only if stagnating
                            if (reps >= exMinReps && reps < exMaxReps) {
                                // Don't chain plateau busters — skip if previous session already had one
                                const prevWorkoutWithPlateau = workoutHistory
                                    .filter(w => {
                                        if (w.date === todayWorkout.date) return false;
                                        if (!w.submitted) return false;
                                        const ex = w.exercises.find(e => e.id === exercise.id);
                                        return ex && ex.reps && ex.reps !== 'NA';
                                    })
                                    .sort((a, b) => new Date(b.date) - new Date(a.date))[0];

                                if (prevWorkoutWithPlateau?.plateauBusters?.includes(exercise.id)) return;

                                const previousExercise = findPreviousValidExercise(exercise.id);
                                if (previousExercise) {
                                    const previousReps = parseInt(previousExercise.reps) || 0;
                                    if (exercise.type === 'bodyweight') {
                                        if (reps <= previousReps) plateauBusters.push(exercise.id);
                                    } else {
                                        const currentWeight = parseFloat(exercise.weight) || 0;
                                        const previousWeight = parseFloat(previousExercise.weight) || 0;
                                        if (currentWeight <= previousWeight && reps <= previousReps) {
                                            plateauBusters.push(exercise.id);
                                        }
                                    }
                                }
                            }
                            // Rule 3: reps >= maxReps — PR, no plateau buster
                        }
                    });
                }

                // Mark workout as submitted (immutable) and save plateau busters
                const updatedHistory = workoutHistory.map(w => {
                    if (w === todayWorkout) {
                        return { ...w, submitted: true, plateauBusters };
                    }
                    return w;
                });

                setWorkoutHistory(updatedHistory);
                window.repo.saveHistory(updatedHistory);

                // Reset all log states so exercises act like a fresh day
                setLoggedExercises({});
                setWorkoutData({});

                setShowDayBreakdown(true);
            };

            const updateWorkout = (workoutDate, updatedExercises) => {
                const updatedHistory = workoutHistory.map(w => {
                    if (w.date === workoutDate) {
                        return { ...w, exercises: updatedExercises };
                    }
                    return w;
                });

                setWorkoutHistory(updatedHistory);
                window.repo.saveHistory(updatedHistory);
                setSuccessMessage('Workout updated!');
                setShowSuccess(true);
                setTimeout(() => setShowSuccess(false), 2000);
            };

            const exportData = () => {
                const exportObj = {
                    workoutHistory,
                    exerciseConfig: buildExerciseConfig(exercisesByDay),
                    schedule: schedule,
                    exportDate: new Date().toISOString()
                };
                const dataStr = JSON.stringify(exportObj, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `gym-tracker-backup-${new Date().toISOString().split('T')[0]}.json`;
                link.click();
                URL.revokeObjectURL(url);
            };

            const importData = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const imported = JSON.parse(e.target.result);

                        // Handle old format (just workout history array) or new format (object with configs)
                        if (Array.isArray(imported)) {
                            // Old format
                            setWorkoutHistory(imported);
                            window.repo.saveHistory(imported);
                        } else {
                            // New format
                            if (imported.workoutHistory) {
                                setWorkoutHistory(imported.workoutHistory);
                                window.repo.saveHistory(imported.workoutHistory);
                            }
                            if (imported.schedule) {
                                setSchedule(imported.schedule);
                                window.repo.saveScheduleConfig(imported.schedule);
                            }
                            if (imported.exerciseConfig) {
                                // Check for version 2 format
                                if (imported.exerciseConfig.version === 2 && imported.exerciseConfig.days) {
                                    const sortedDays = {};
                                    Object.keys(imported.exerciseConfig.days).forEach(dayNum => {
                                        sortedDays[dayNum] = imported.exerciseConfig.days[dayNum].sort((a, b) => a.order - b.order);
                                    });
                                    setExercisesByDay(sortedDays);
                                    if (imported.exerciseConfig.categories) {
                                        setExerciseCategories(imported.exerciseConfig.categories);
                                    }
                                }
                                // Fallback to old format
                                else if (imported.exerciseConfig.day1 || imported.exerciseConfig.day2) {
                                    const days = {};
                                    if (imported.exerciseConfig.day1) {
                                        days[1] = imported.exerciseConfig.day1.sort((a, b) => a.order - b.order);
                                    }
                                    if (imported.exerciseConfig.day2) {
                                        days[2] = imported.exerciseConfig.day2.sort((a, b) => a.order - b.order);
                                    }
                                    setExercisesByDay(days);
                                }
                                // Restore tracking flags into state
                                if (imported.exerciseConfig.prTracking !== undefined) {
                                    setPrTracking(imported.exerciseConfig.prTracking);
                                }
                                if (imported.exerciseConfig.advancedPrTracking !== undefined) {
                                    setAdvancedPrTracking(imported.exerciseConfig.advancedPrTracking);
                                }
                                if (imported.exerciseConfig.minimalistPrTracking !== undefined) {
                                    setMinimalistPrTracking(imported.exerciseConfig.minimalistPrTracking);
                                }
                                if (imported.exerciseConfig.gympinMode !== undefined) {
                                    setGympinMode(imported.exerciseConfig.gympinMode);
                                }
                                if (imported.exerciseConfig.repsDropdown !== undefined) {
                                    setRepsDropdown(imported.exerciseConfig.repsDropdown);
                                }
                                window.repo.saveExerciseConfig(imported.exerciseConfig);
                            }
                        }

                        setSuccessMessage('Data imported successfully!');
                        setShowSuccess(true);
                        setTimeout(() => setShowSuccess(false), 3000);
                        setShowSettings(false);
                    } catch (error) {
                        alert('Invalid backup file');
                    }
                };
                reader.readAsText(file);
            };

            const resetData = () => {
                if (confirm('ARE YOU VERY SURE? This will delete ALL your workout data AND exercise customizations permanently. This cannot be undone!')) {

                        setWorkoutHistory([]);

                        setExerciseCategories([]);
                        setPrTracking(false);

                        setGympinMode(false);
                        setRepsDropdown(null);
                        setShowSettings(false);
                        setShowWizard(true); // Show wizard after reset

                }
            };

            const dismissBackupReminder = () => {

                // Show tutorial on first time
                const hasSeenTutorial = storage.getItem('hasSeenTutorial');

            const dismissTutorial = () => {

            // Storage not read yet: render nothing rather than a flash of

            if (!hydrated) {
                return <div className="app" />;

            return (
                <div className="app">

                                        if (config.categories) {
                                            setExerciseCategories(config.categories);
                                        }

                                        if (config.prTracking !== undefined) {
                                            setPrTracking(config.prTracking);
                                        }
                                        if (config.advancedPrTracking !== undefined) {
                                            setAdvancedPrTracking(config.advancedPrTracking);
                                        }
                                        if (config.minimalistPrTracking !== undefined) {
                                            setMinimalistPrTracking(config.minimalistPrTracking);
                                        }
                                        if (config.gympinMode !== undefined) {
                                            setGympinMode(config.gympinMode);
                                        }
                                        if (config.repsDropdown !== undefined) {
                                            setRepsDropdown(config.repsDropdown);
                                        }
                                    }
                                }

                                // Show tutorial for new users (both custom and coaching programs)
                                const hasSeenTutorial = storage.getItem('hasSeenTutorial');
                                if (!hasSeenTutorial) {
                                    setShowTutorial(true);
                                }

                                setShowWizard(false);
                            }}
                        />

                    {showDayBreakdown && (

                        />
                    )}

                    <div className="header">
                        <div className="header-top">
                            <h1>Gym Tracker</h1>
                            <button className="settings-btn" onClick={() => setShowSettings(true)}>⚙️</button>
                        </div>
                        <div className="week-indicator">Week {currentWeek}</div>
                        <div className="nav">

                                onClick={() => { window.scrollTo({ top: 0, behavior: 'smooth' }); setCurrentView('workout'); }}

                    <div className="content">

                            loggedExercises={loggedExercises}

                            celebration={celebration}

                            repsDropdown={repsDropdown}

                            setExpandedWeightBreakdown={setExpandedWeightBreakdown}

                        {currentView === 'weekly' && <WeeklyView

                            }}

                        {currentView === 'progress' && <ProgressView

                    </div>

            );
        }

            const handleCancelEdit = () => {

                setTempMaxReps('');
            };

            if (settingsView.startsWith('exercises-')) {

                const exercises = exercisesByDay[day] || [];

                return (
                    <div className="modal-overlay" onClick={onClose}>

        function DayBreakdownModal({ onClose, workoutHistory, currentDay, getCurrentExercises, getPreviousWorkout }) {
            // Find today's workout
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const todayWorkout = workoutHistory.find(w => {
                const workoutDate = new Date(w.date);
                workoutDate.setHours(0, 0, 0, 0);
                const isSameDay = workoutDate.getTime() === today.getTime();
                const isSameWorkoutDay = w.day === currentDay;
                return isSameDay && isSameWorkoutDay;
            });

            if (!todayWorkout) {
                return null;
            }

            // Function to get previous workout excluding today
            const getPreviousWorkoutExcludingToday = (exerciseId) => {
                for (let workout of workoutHistory) {
                    // Skip today's workout
                    const workoutDate = new Date(workout.date);
                    workoutDate.setHours(0, 0, 0, 0);
                    if (workoutDate.getTime() === today.getTime() && workout.day === currentDay) {
                        continue;
                    }

                    const exercise = workout.exercises.find(e => e.id === exerciseId);
                    if (exercise) {
                        // For cardio, check that time is actually > 0 (not just "0:00")
                        if (exercise.isCardio || exercise.type === 'cardio') {
                            const totalSeconds = ((exercise.minutes || 0) * 60) + (exercise.seconds || 0);
                            if (totalSeconds > 0) {
                                return exercise;
                            }
